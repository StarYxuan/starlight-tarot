<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>星月塔罗 | Starlight Tarot</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;color:#f4edff;
 font-family:Georgia,"Songti SC",serif;
 background:radial-gradient(ellipse at 20% 10%,#574a91,transparent 48%),
 radial-gradient(ellipse at 85% 75%,#263f83,transparent 50%),
 linear-gradient(145deg,#100e29,#21183f,#101c3d);
 background-attachment:fixed
}
body:before{
 content:"";position:fixed;inset:0;pointer-events:none;
 background-image:radial-gradient(#fff 1px,transparent 1px),
 radial-gradient(#c9b7ff 1px,transparent 1px);
 background-size:47px 47px,83px 83px;opacity:.22
}
main{position:relative;max-width:760px;margin:auto;padding:35px 16px 80px;text-align:center}
.moon{font-size:65px;text-shadow:0 0 25px #d5c0ff}
h1{font-size:34px;font-weight:normal;letter-spacing:5px;margin:8px}
.sub{color:#cbbaf5;letter-spacing:3px;font-size:12px}
h2{font-weight:normal;font-size:23px}
.panel{
 background:#ffffff0d;border:1px solid #a48ad266;
 border-radius:20px;padding:20px;margin:22px 0;
 backdrop-filter:blur(8px)
}
button,select,input,textarea{
 font:inherit;border-radius:12px;padding:12px;
 border:1px solid #b6a0e0
}
button{
 color:white;background:linear-gradient(120deg,#8068c8,#557dc1);
 cursor:pointer;margin:5px;box-shadow:0 0 15px #8c78d444
}
button.active{background:linear-gradient(120deg,#b293e9,#798ee6)}
button:disabled{opacity:.4}
select,input,textarea{
 background:#ffffff15;color:white;width:100%;margin:8px 0
}
option{color:#21183f}
input::placeholder,textarea::placeholder{color:#c4b7db}
.hidden{display:none}
.deck {
  display: flex;
  flex-wrap: nowrap;
  justify-content: flex-start;
  align-items: center;
  gap: 0;
  width: 100%;
  overflow-x: auto;
  overflow-y: hidden;
  padding: 25px 12px;
  margin: 20px auto;
  scroll-behavior: smooth;
  -webkit-overflow-scrolling: touch;
}

.deck .card {
  flex: 0 0 76px;
  margin-right: -45px;
  transition: transform 0.25s ease;
}

.deck .card:last-child {
  margin-right: 0;
}

.deck .card:active {
  transform: translateY(-18px);
  z-index: 10;
}
.card{
 width:76px;height:120px;border:1px solid #d7c1ff;
 border-radius:9px;background:linear-gradient(145deg,#53468c,#263e7c);
 display:flex;align-items:center;justify-content:center;
 flex-direction:column;cursor:pointer;box-shadow:0 0 15px #b29cff55;
 transition:transform .3s
}
.card:active{transform:scale(.94)}
.card.back{font-size:30px}
.card.back:after{content:"✧";font-size:15px;margin-top:8px}
.card.face{background:linear-gradient(150deg,#e8dcff,#b9c9f4);color:#30254e}
.symbol{font-size:34px}
.card-name{font-size:11px;margin-top:8px}
.reversed .symbol{transform:rotate(180deg)}
#spreadCards{display:flex;flex-wrap:wrap;justify-content:center;gap:12px}
.spread-item{width:95px;text-align:center}
.spread-item .card{margin:8px auto;width:90px;height:140px}
.position{font-size:12px;color:#d9c8ff;min-height:30px}
.reading{text-align:left;line-height:1.8}
.reading-item{
 padding:14px;margin:12px 0;border:1px solid #a18ed088;
 border-radius:13px;background:#ffffff0d
}
.small{font-size:13px;color:#cbbce9}
/* 星月塔罗牌面图片 */
.tarot-image {
  display: block;
  width: 100%;
  height: 175px;
  object-fit: contain;
  border-radius: 7px;
  margin: 0 auto 8px;
}

  .card.face {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 6px;
  box-sizing: border-box;
  overflow: hidden;
}

.card.face .card-name {
  position: static;
  width: 100%;
  text-align: center;
  font-size: 11px;
  line-height: 1.4;
  margin-top: 3px;
  color: #332650;
  transform: none;
}
.card.face {
  overflow: hidden;
}
.card.face {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 5px;
  box-sizing: border-box;
  overflow: hidden;
}

.tarot-image {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
  border-radius: 7px;
  margin: 0;
}

.card-name-outside {
  margin-top: 10px;
  text-align: center;
  font-size: 13px;
  line-height: 1.5;
  color: #f5edff;
  white-space: nowrap;
}
.shuffle-stage {
  text-align: center;
  padding: 30px 12px;
}

.shuffle-stage h3 {
  font-size: 23px;
  color: #f5eaff;
}

.shuffle-stage p {
  color: #ddd0f5;
  font-size: 14px;
}

.shuffle-pile {
  position: relative;
  width: 160px;
  height: 250px;
  margin: 35px auto;
  touch-action: none;
  user-select: none;
  cursor: grab;
}

.shuffle-card {
  position: absolute;
  inset: 0;
  border-radius: 13px;
  border: 2px solid #c5b1ff;
  background: linear-gradient(145deg, #7154af, #28204f);
  box-shadow: 0 8px 25px #120b2c80;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #f8eaff;
  font-size: 55px;
  pointer-events: none;
  transition: transform .3s ease;
}

.layer3 {
  transform: translate(9px, -9px) rotate(5deg);
}

.layer2 {
  transform: translate(-6px, -4px) rotate(-4deg);
}

.layer1 {
  transform: translate(0, 0);
}

.shuffle-pile.swiping .layer1 {
  transform: translateX(65px) rotate(17deg);
}

.shuffle-pile.swiping .layer2 {
  transform: translateX(-35px) rotate(-12deg);
}

.shuffle-pile.holding .layer1 {
  animation: shuffleLeft .35s infinite alternate;
}

.shuffle-pile.holding .layer2 {
  animation: shuffleRight .35s infinite alternate;
}

@keyframes shuffleLeft {
  to { transform: translate(55px, -12px) rotate(15deg); }
}

@keyframes shuffleRight {
  to { transform: translate(-55px, 8px) rotate(-15deg); }
}
.shuffle-effect {
  animation: manualShuffle 0.6s ease;
}

@keyframes manualShuffle {
  0% {
    transform: translateX(0);
  }
  25% {
    transform: translateX(-15px) rotate(-2deg);
  }
  50% {
    transform: translateX(15px) rotate(2deg);
  }
  75% {
    transform: translateX(-8px) rotate(-1deg);
  }
  100% {
    transform: translateX(0);
  }
}
/* ===== 星月塔罗：三叠切牌 ===== */

#cutStage {
  text-align: center;
  padding: 20px 0;
}

.cut-area {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 18px;
  margin: 40px auto;
}

.cut-pile {
  position: relative;
  width: 85px;
  height: 130px;
  padding: 0;
  border: 2px solid #d9c5ff;
  border-radius: 12px;

  background: linear-gradient(
    145deg,
    #8c70d5,
    #4d398d 55%,
    #211a4d
  );

  color: #fff;
  box-shadow:
    0 5px 0 #372963,
    0 10px 0 #241b48,
    0 15px 22px #08051b99;

  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 12px;

  cursor: pointer;
  transition:
    transform 0.3s ease,
    box-shadow 0.3s ease,
    opacity 0.3s ease;
}

.cut-pile span {
  font-size: 36px;
  color: #f5e7ff;
  text-shadow: 0 0 18px #e6caff;
}

.cut-pile small {
  font-size: 12px;
  color: #e5d8ff;
}

.cut-pile:active {
  transform: translateY(-12px) scale(1.05);
}

.cut-pile.selected {
  transform: translateY(-22px);
  border-color: #ffe8a3;
  box-shadow:
    0 5px 0 #65509b,
    0 10px 0 #372963,
    0 0 28px #d9b8ff99;
  opacity: 0.7;
}

.cut-pile:disabled {
  cursor: default;
}

@media (max-width: 400px) {
  .cut-area {
    gap: 12px;
  }

  .cut-pile {
    width: 78px;
    height: 120px;
  }
}
/* ===== 星月塔罗：半圆扇形铺牌 ===== */

.tarot-fan {
  position: relative;
  width: 100%;
  height: 300px;
  margin: 25px auto 15px;
  display: block;
  overflow: visible;
  touch-action: pan-y;
}

/* 扇形中的每张牌 */
.tarot-fan .fan-card {
  position: absolute;
  left: 50%;
  top: 25px;

  width: 76px;
  height: 120px;
  margin: 0;

  transform-origin: 50% 115%;

  transform:
    translateX(calc(-50% + var(--x)))
    translateY(var(--y))
    rotate(var(--angle));

  transition:
    transform 0.35s ease,
    filter 0.35s ease;

  border: 1px solid #d9c5ff;
  border-radius: 9px;

  background: linear-gradient(
    145deg,
    #8066c8,
    #493477 55%,
    #21163f
  );

  box-shadow:
    0 0 8px #c6a8ff55,
    0 5px 15px #00000055;

  cursor: pointer;
  user-select: none;
  -webkit-user-select: none;
}

/* 触碰卡牌时上浮 */
.tarot-fan .fan-card:hover {
  transform:
    translateX(calc(-50% + var(--x)))
    translateY(calc(var(--y) - 22px))
    rotate(var(--angle))
    scale(1.08);

  filter: brightness(1.25);
  box-shadow:
    0 0 15px #d9b8ff,
    0 0 30px #a88cff88;
}

/* 点击反馈 */
.tarot-fan .fan-card:active {
  filter: brightness(1.5);
}

/* 手机屏幕适配 */
@media (max-width: 480px) {
  .tarot-fan {
    height: 270px;
  }

  .tarot-fan .fan-card {
    width: 60px;
    height: 96px;
    font-size: 24px;
  }
}
/* 星月塔罗：滑动选牌区域 */
.tarot-fan {
  position: relative;
  width: 100%;
  height: 300px;
  overflow: hidden;
  touch-action: pan-y;
  user-select: none;
}

/* 放大牌背 */
.tarot-fan .fan-card {
  position: absolute;
  width: 110px;
  height: 175px;
  margin: 0;
  left: 50%;
  top: 65px;
  transform-origin: center bottom;
  transform:
    translateX(calc(-50% + var(--x)))
    translateY(var(--y))
    rotate(var(--angle));
  transition: transform 0.2s ease;
  border: 2px solid #d9c5ff;
  border-radius: 10px;
  background: linear-gradient(
    145deg,
    #9679dc,
    #55408f 55%,
    #251944
  );
  box-shadow: 0 0 12px #c6a8ff77;
  cursor: pointer;
}

.tarot-fan .fan-card.focused {
  filter: brightness(1.3);
  border-color: #ffe7b0;
  box-shadow: 0 0 25px #e3caff;
}
/* 横向滑动选牌 */

.tarot-scroll {
  display: flex;
  gap: 14px;
  width: 100%;
  padding: 30px 20px 40px;
  box-sizing: border-box;

  overflow-x: auto;
  overflow-y: hidden;

  scroll-snap-type: x proximity;
  -webkit-overflow-scrolling: touch;

  touch-action: pan-x;
}

.tarot-scroll .scroll-card {
  position: relative;
  flex: 0 0 110px;

  width: 110px;
  height: 175px;

  margin: 0;
  transform: none;

  scroll-snap-align: center;

  cursor: pointer;
}

.tarot-scroll .scroll-card:active {
  transform: translateY(-12px);
  box-shadow: 0 0 25px #d9c5ff;
}

.tarot-scroll::-webkit-scrollbar {
  display: none;
}
/* 中间聚焦的塔罗牌 */
.tarot-scroll .scroll-card.focused {
  transform: translateY(-12px) scale(1.12);
  border-color: #ffe7b0;
  box-shadow:
    0 0 18px #e3caff,
    0 0 35px #b99aff;
  filter: brightness(1.2);
  z-index: 10;
}
.confirm-draw-btn {
  display: block;
  margin: 5px auto 30px;
  padding: 14px 38px;

  border: 1px solid #e3caff;
  border-radius: 30px;

  background: linear-gradient(135deg, #9370db, #57428f);
  color: white;

  font-size: 17px;
  letter-spacing: 3px;

  box-shadow: 0 0 20px rgba(185, 154, 255, 0.45);
  cursor: pointer;
}

.confirm-draw-btn:active {
  transform: scale(0.96);
}
</style>
</head>

<body>
<main>

<script>
// 大阿尔卡那：名称、符号、正位、逆位
const major=[
["愚人","🦋","新开始、自由、冒险","冲动、准备不足"],
["魔术师","✨","行动、创造、实现","能力受阻、缺乏自信"],
["女祭司","🌙","直觉、秘密、智慧","忽视直觉、信息不明"],
["女皇","🌸","丰盛、魅力、成长","依赖、停滞"],
["皇帝","👑","稳定、责任、秩序","控制欲、固执"],
["教皇","📜","传统、学习、指引","质疑传统、打破规则"],
["恋人","💕","吸引、关系、选择","失衡、分歧"],
["战车","🏹","前进、胜利、意志","失控、方向不明"],
["力量","🦁","勇气、耐心、温柔","自我怀疑、信心不足"],
["隐士","🏮","独处、思考、探索","孤立、逃避"],
["命运之轮","🎡","转机、变化、机遇","延迟、抗拒变化"],
["正义","⚖️","公平、真相、责任","失衡、偏见"],
["倒吊人","🪢","等待、换位思考","停滞、抗拒"],
["死神","🥀","结束、转变、新生","难以放下、抗拒结束"],
["节制","🕊️","平衡、疗愈、协调","急躁、失衡"],
["恶魔","⛓️","欲望、执念、束缚","挣脱束缚、觉察欲望"],
["高塔","⚡","突变、真相、重建","害怕改变、危机延迟"],
["星星","⭐","希望、灵感、治愈","失望、信心不足"],
["月亮","🌘","潜意识、迷雾、情绪","困惑、恐惧、迷雾消散"],
["太阳","☀️","快乐、成功、光明","快乐延迟、短暂低落"],
["审判","🪽","觉醒、决定、重生","逃避决定、自我怀疑"],
["世界","🌍","完成、圆满、成就","尚未完成、缺少收尾"]
];

// 小阿尔卡那：每个花色14张
const suits=[
{name:"权杖",symbol:"🔥",up:"行动、热情、创造力",down:"冲动、动力受阻"},
{name:"圣杯",symbol:"💧",up:"感情、直觉、人际关系",down:"情绪失衡、感情阻碍"},
{name:"宝剑",symbol:"⚔️",up:"思考、沟通、挑战",down:"焦虑、冲突、思维受阻"},
{name:"星币",symbol:"🪙",up:"现实、财富、稳定",down:"资源不足、进展缓慢"}
];
const ranks=["王牌","二","三","四","五","六","七","八","九","十","侍从","骑士","皇后","国王"];

const minor=[];
suits.forEach(s=>{
 ranks.forEach(r=>{
  minor.push([s.name+r,s.symbol,s.up,s.down]);
 });
});
const tarot=[...major,...minor];
  // ===== 78张韦特塔罗牌图片 =====

const tarotImageNames = [
  "m00","m01","m02","m03","m04","m05","m06","m07",
  "m08","m09","m10","m11","m12","m13","m14","m15",
  "m16","m17","m18","m19","m20","m21"
];

const suitImageCodes = {
  "权杖": "w",
  "圣杯": "c",
  "宝剑": "s",
  "星币": "p"
};

const rankImageCodes = {
  "王牌": "01",
  "二": "02",

function shuffle(a){

 for(let i=b.length-1;i>0;i--){
  let j=Math.floor(Math.random()*(i+1));
  [b[i],b[j]]=[b[j],b[i]];
 }
 return b;
}

function doManualShuffle() {
  if (!Array.isArray(shuffled) || shuffled.length !== 78) return;

  shuffled = shuffle(shuffled);
  shuffleCount++;

  document.getElementById("shuffleCount").textContent =
    "已洗牌 " + shuffleCount + " 次";

function stopManualShuffle() {
  shufflePointerDown = false;

  clearTimeout(shuffleHoldTimer);
  clearInterval(shuffleTimer);

  shuffleHoldTimer = null;
  shuffleTimer = null;

  document.getElementById("shufflePile")
    .classList.remove("holding");
}

function initManualShuffle() {
  const pile = document.getElementById("shufflePile");

  pile.addEventListener("pointerdown", e => {
    if (shufflePointerDown) return;

    shufflePointerDown = true;
    shuffleDidHold = false;
    shuffleStartX = e.clientX;
    shuffleStartY = e.clientY;

    if (pile.setPointerCapture) {
      pile.setPointerCapture(e.pointerId);
    }

    shuffleHoldTimer = setTimeout(() => {
      if (!shufflePointerDown) return;

      shuffleDidHold = true;
      pile.classList.add("holding");

      doManualShuffle();

      shuffleTimer = setInterval(() => {
        doManualShuffle();
      }, 350);
    }, 500);
  });

  pile.addEventListener("pointermove", e => {
    if (!shufflePointerDown) return;

    const dx = e.clientX - shuffleStartX;
    const dy = e.clientY - shuffleStartY;

    if (Math.abs(dx) > 20 || Math.abs(dy) > 20) {
      clearTimeout(shuffleHoldTimer);
      shuffleHoldTimer = null;
    }
  });

  pile.addEventListener("pointerup", e => {
    if (!shufflePointerDown) return;

    const dx = e.clientX - shuffleStartX;
    const wasHolding = shuffleDidHold;

    stopManualShuffle();

    if (!wasHolding && Math.abs(dx) > 35) {
      doManualShuffle();
    }
  });

  pile.addEventListener("pointercancel", stopManualShuffle);
  pile.addEventListener("lostpointercapture", stopManualShuffle);
}

function detectReadingType(question) {
  const selected = document.getElementById("readingType").value;

  if (selected !== "auto") {

  const q = question.toLowerCase();

  const categories = {
    love: ["喜欢", "暗恋", "恋爱", "感情", "对象", "复合", "暧昧", "脱单", "爱情", "男朋友", "女朋友"],

    social: ["朋友", "友情", "社交", "人际", "关系", "相处", "矛盾"]
  };

  let bestType = "general";
  let bestScore = 0;

  for (const [type, keywords] of Object.entries(categories)) {
    const score = keywords.filter(word => q.includes(word)).length;

    if (score > bestScore) {
      bestScore = score;
      bestType = type;
    }
  }

  return bestType;
}

  function updateFocusedCard() {
    const cards = area.querySelectorAll(".scroll-card");
    const center = area.getBoundingClientRect().left + area.clientWidth / 2;

    let closest = null;
    let minDistance = Infinity;

    cards.forEach(card => {
      const rect = card.getBoundingClientRect();
      const cardCenter = rect.left + rect.width / 2;
      const distance = Math.abs(cardCenter - center);

      if (distance < minDistance) {
        minDistance = distance;
        closest = card;
      }
    });

    cards.forEach(card => {
      card.classList.toggle("focused", card === closest);
    });
  }

  area.addEventListener("scroll", updateFocusedCard, { passive: true });
  requestAnimationFrame(updateFocusedCard);

// 判断塔罗牌所属花色
function getSuit(name) {
  if (name.startsWith("权杖")) return "权杖";
  if (name.startsWith("圣杯")) return "圣杯";
  if (name.startsWith("宝剑")) return "宝剑";
  if (name.startsWith("星币")) return "星币";
  return "大阿尔卡那";
}


// 根据牌阵位置生成解释
function explainPosition(position) {
  const rules = {
    "过去": "这张牌可以用来回顾过去的经历，以及它们对现在的影响。",
    "现在": "这张牌反映值得关注的当前状态。",
    "未来": "这张牌象征未来可能出现的发展方向，而不是确定的结果。",
    "现状": "这张牌帮助你理解目前的处境。",
    "阻碍": "这张牌提醒你关注可能存在的困难或限制。",
    "建议": "这张牌可以作为思考下一步行动的参考。",
    "未来趋势": "这张牌象征事情可能呈现的发展趋势。",
    "关系核心": "这张牌帮助你思考这段关系中最重要的主题。",
    "隐藏因素": "这张牌提醒你关注尚未充分了解的因素。",
    "当前状况": "这张牌帮助你审视目前的整体情况。",
    "挑战": "这张牌代表需要认真面对的问题。",
    "近期未来": "这张牌象征近期值得留意的发展方向。",
    "最终趋势": "这张牌提供一种关于整体发展方向的象征性视角。"
  };

  return rules[position] ||
    "结合这张牌所在的位置，可以进一步思考它与你的问题之间的联系。";
}


// 根据整组牌生成综合分析
function generateSummary() {
  const total = chosen.length;

  const upright = chosen.filter(
    item => !item.reversed
  ).length;

  const reversed = total - upright;

  const suitsCount = {
    权杖: 0,
    圣杯: 0,
    宝剑: 0,
    星币: 0,
    大阿尔卡那: 0
  };

  chosen.forEach(item => {
    const suit = getSuit(item.data[0]);
    suitsCount[suit]++;
  });

  const dominant = Object.entries(suitsCount)
    .filter(([name]) => name !== "大阿尔卡那")
    .sort((a, b) => b[1] - a[1]);

  let summary = "";

  if (upright > reversed) {
    summary += "这组牌中正位较多，整体可以从主动发展、资源利用和寻找机会的角度理解。";
  } else if (reversed > upright) {
    summary += "这组牌中逆位较多，可能更适合关注内在阻碍、尚未解决的问题，以及需要调整的地方。";
  } else {
    summary += "这组牌的正逆位数量相对平衡，可以同时关注积极因素与潜在挑战。";
  }

  if (suitsCount["大阿尔卡那"] >= 2) {
    summary += "多张大阿尔卡那同时出现，象征这次问题可能涉及较重要的个人选择、价值观或成长主题。";
  }

  if (dominant.length > 0 && dominant[0][1] >= 2) {
    const suit = dominant[0][0];

    const meanings = {
      权杖: "行动、热情与目标",
      圣杯: "情绪、感情与人际连接",
      宝剑: "思考、沟通与现实挑战",
      星币: "稳定、资源与实际行动"
    };

    summary +=
      "其中「" + suit + "」出现较多，" +
      "说明从象征意义上，可以特别关注" +
      meanings[suit] + "。";
  }

  return summary;
}

// ===== 新版解牌函数 =====
  // ===== 星月塔罗：多牌关联分析 =====

function analyzeCardConnections() {
  if (chosen.length < 2) {
    return "单张牌更适合聚焦当前问题的核心主题。";
  }

  const cards = chosen.map(item => {
    const name = item.data[0];
    const meaning = item.reversed
      ? item.data[3]
      : item.data[2];

    return {
      name,
      reversed: item.reversed,
      meaning,
      suit: getSuit(name)
    };
  });

  const suitThemes = {
    权杖: "行动与改变",
    圣杯: "情绪与关系",
    宝剑: "思考与挑战",
    星币: "现实与稳定",
    大阿尔卡那: "个人成长与重要课题"
  };

  // 分析相邻卡牌的关系
  const connections = [];

  for (let i = 0; i < cards.length - 1; i++) {
    const first = cards[i];
    const second = cards[i + 1];

    let text = "";

    if (first.suit === second.suit) {
      text =
        "第" + (i + 1) + "张与第" + (i + 2) +
        "张都属于「" + first.suit + "」，" +
        "说明「" + suitThemes[first.suit] +
        "」可能是这两张牌共同强调的主题。";
    } else {
      text =
        "从「" + first.name + "」到「" +
        second.name + "」，牌面的关注点由「" +
        suitThemes[first.suit] + "」转向「" +
        suitThemes[second.suit] + "」。";
    }

    if (first.reversed && !second.reversed) {
      text +=
        "两张牌呈现逆位到正位的变化，" +
        "可以理解为从阻碍、调整逐渐转向新的可能性。";
    } else if (!first.reversed && second.reversed) {
      text +=
        "两张牌呈现正位到逆位的变化，" +
        "提醒你在发展过程中留意潜在困难。";
    } else if (first.reversed && second.reversed) {
      text +=
        "两张牌均为逆位，可能需要关注反复出现的阻碍或内在矛盾。";
    } else {
      text +=
        "两张牌均为正位，可以重点观察它们所代表的资源与机会如何相互配合。";
    }

    connections.push(text);
  }

  // 分析首尾变化
  const first = cards[0];
  const last = cards[cards.length - 1];

  let trend =
    "从整组牌的顺序来看，" +
    "最初的「" + first.name + "」强调「" +
    first.meaning + "」，" +
    "最后的「" + last.name + "」则强调「" +
    last.meaning + "」。";

  trend +=
    "如果你的牌阵具有时间顺序，" +
    "可以将这种变化作为理解事情发展方向的参考；" +
    "如果没有时间顺序，则更适合把它理解为不同角度之间的联系。";

  return connections.join("\n\n") + "\n\n" + trend;
}

content.appendChild(summaryBox);
